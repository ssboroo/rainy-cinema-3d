openapi: 3.1.0
info:
  title: RAINY CINEMA API
  version: 1.0.0
  description: Tenant-scoped cinema inventory and seat-hold API. Booking confirmation remains disabled until a verified payment provider is configured.
servers:
  - url: https://your-domain.example
paths:
  /health/live:
    get:
      summary: Liveness probe
      responses:
        '200': { description: Process is alive }
  /health/ready:
    get:
      summary: Readiness probe
      responses:
        '200': { description: Database is reachable }
        '503': { description: Database is unavailable }
  /api/v1/auth/login:
    post:
      summary: Create a short-lived access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, tenantSlug]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 10, maxLength: 256 }
                tenantSlug: { type: string, pattern: '^[a-z0-9-]+$' }
      responses:
        '200': { description: Bearer access token }
        '401': { description: Invalid credentials }
  /api/v1/showtimes/{showtimeId}/seats:
    get:
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: showtimeId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Tenant-scoped seat inventory }
        '401': { description: Authentication required }
  /api/v1/showtimes/{showtimeId}/holds:
    post:
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: showtimeId
          required: true
          schema: { type: string, format: uuid }
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seatIds]
              properties:
                seatIds:
                  type: array
                  minItems: 1
                  maxItems: 6
                  uniqueItems: true
                  items: { type: string, pattern: '^[A-Z]{1,3}[1-9][0-9]{0,2}$' }
      responses:
        '201': { description: Seat hold created }
        '409': { description: Seat unavailable or showtime not on sale }
        '422': { description: Validation or idempotency conflict }
  /api/v1/holds/{holdId}:
    delete:
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: holdId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '204': { description: Hold released }
        '404': { description: Hold not found }
  /api/v1/holds/{holdId}/bookings:
    post:
      security: [{ bearerAuth: [] }]
      responses:
        '503': { description: Disabled until payment and cinema provider verification is configured }
  /api/v1/cinemas:
    post:
      security: [{ bearerAuth: [] }]
      summary: Create a tenant cinema (OWNER, ADMIN, OPERATOR)
      responses:
        '201': { description: Cinema created }
        '403': { description: Insufficient role }
  /api/v1/cinemas/{cinemaId}/auditoriums:
    post:
      security: [{ bearerAuth: [] }]
      summary: Create an auditorium in a tenant cinema
      parameters:
        - in: path
          name: cinemaId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '201': { description: Auditorium created }
        '404': { description: Cinema not found }
  /api/v1/auditoriums/{auditoriumId}/seats:
    put:
      security: [{ bearerAuth: [] }]
      summary: Replace an auditorium seat layout
      parameters:
        - in: path
          name: auditoriumId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Layout saved and version incremented }
        '409': { description: Auditorium has active or upcoming showtimes }
  /api/v1/showtimes:
    post:
      security: [{ bearerAuth: [] }]
      summary: Create a showtime and snapshot its seat inventory
      responses:
        '201': { description: Showtime created }
        '409': { description: Auditorium has no active seats }
  /api/v1/showtimes/{showtimeId}:
    patch:
      security: [{ bearerAuth: [] }]
      summary: Change showtime sale status
      parameters:
        - in: path
          name: showtimeId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200': { description: Showtime status updated }
        '404': { description: Showtime not found }
  /api/v1/integrations:
    get:
      security: [{ bearerAuth: [] }]
      summary: List cinema provider connectors and their access status
      responses:
        '200': { description: Provider capability and readiness list }
  /api/v1/integrations/{providerId}/health:
    get:
      security: [{ bearerAuth: [] }]
      summary: Check a configured cinema provider
      parameters:
        - in: path
          name: providerId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Provider connectivity result }
        '503': { description: Provider is not configured }
  /api/v1/integrations/{providerId}/sessions:
    get:
      security: [{ bearerAuth: [] }]
      summary: Read sessions from a cinema provider
      parameters:
        - in: path
          name: providerId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Normalized external showtimes }
  /api/v1/integrations/{providerId}/sessions/{sessionId}/seats:
    get:
      security: [{ bearerAuth: [] }]
      summary: Read external provider seat plan
      parameters:
        - in: path
          name: providerId
          required: true
          schema: { type: string }
        - in: path
          name: sessionId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Normalized seat plan with provider freshness metadata }
        '503': { description: Provider is not configured }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
